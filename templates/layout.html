<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ app_name or "La MilaGrosa" }}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background-color: #f8f9fa;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: .6rem;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: .5px;
    }

    .navbar-brand img {
      height: 36px;
      width: 36px;
      object-fit: contain;
    }

    .brand-name {
      color: #212529;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-light bg-white border-bottom shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo La MilaGrosa">
      <span class="brand-name">La MilaGrosa</span>
    </a>

    <div class="d-flex gap-2">
      <a href="{{ url_for('venta_nueva') }}" class="btn btn-primary">
        Nueva venta
      </a>
      <a href="{{ url_for('ventas') }}" class="btn btn-outline-secondary">
        Ventas
      </a>
    </div>
  </div>
</nav>

<main class="container py-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
